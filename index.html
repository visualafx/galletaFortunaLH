<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>¿Qué dice tu suerte hoy?</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="promo" aria-label="Promoción Suerte La Hacienda">

    <!-- INICIO: SPLASH SCREEN -->
    <div id="splash-screen" aria-hidden="true">

      <div class="splash-flash"></div>

      <div class="splash-particles">
        <i style="--a:0deg;--d:48vmax"></i>
        <i style="--a:12deg;--d:32vmax"></i>
        <i style="--a:24deg;--d:58vmax"></i>
        <i style="--a:36deg;--d:28vmax"></i>
        <i style="--a:48deg;--d:45vmax"></i>
        <i style="--a:60deg;--d:35vmax"></i>
        <i style="--a:72deg;--d:55vmax"></i>
        <i style="--a:84deg;--d:25vmax"></i>
        <i style="--a:96deg;--d:48vmax"></i>
        <i style="--a:108deg;--d:38vmax"></i>
        <i style="--a:120deg;--d:58vmax"></i>
        <i style="--a:132deg;--d:25vmax"></i>
        <i style="--a:144deg;--d:45vmax"></i>
        <i style="--a:156deg;--d:32vmax"></i>
        <i style="--a:168deg;--d:55vmax"></i>
        <i style="--a:180deg;--d:38vmax"></i>
        <i style="--a:192deg;--d:48vmax"></i>
        <i style="--a:204deg;--d:28vmax"></i>
        <i style="--a:216deg;--d:58vmax"></i>
        <i style="--a:228deg;--d:35vmax"></i>
        <i style="--a:240deg;--d:45vmax"></i>
        <i style="--a:252deg;--d:25vmax"></i>
        <i style="--a:264deg;--d:55vmax"></i>
        <i style="--a:276deg;--d:38vmax"></i>
        <i style="--a:288deg;--d:48vmax"></i>
        <i style="--a:300deg;--d:32vmax"></i>
        <i style="--a:312deg;--d:58vmax"></i>
        <i style="--a:324deg;--d:25vmax"></i>
        <i style="--a:336deg;--d:45vmax"></i>
        <i style="--a:348deg;--d:35vmax"></i>
      </div>

    </div>

    <!-- Fondo principal -->
    <img class="asset fondo-1" src="assets/fondo1.jpg" alt="" />

    <!-- Logo -->
    <img class="asset logo" src="assets/logo2.png" alt="Suerte" />

    <!-- Personaje -->
    <img class="asset mujer" src="assets/mujer.png" alt="" />

    <!-- BANNERS -->
    <div class="banners">

      <!-- Banner principal -->
      <img class="asset banner-1" src="assets/banner1.png" alt="" />

      <!-- Banner inferior -->
      <img class="asset banner-2" src="assets/banner2.png" alt="" />
    </div>

    <!-- Base inferior con arco -->
    <div class="fondo-2"></div>

  </main>
</body>

</html>
